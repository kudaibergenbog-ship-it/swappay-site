<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwapPay Exchange</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.hero{
padding:30px;
max-width:900px;
margin:auto;
}

.exchange-box{
background:#1e293b;
padding:25px;
border-radius:15px;
}

h2{
text-align:center;
}

select,input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#22c55e;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:40px;
}

.feature{
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
}

footer{
margin-top:50px;
padding:20px;
text-align:center;
background:#111827;
}

a{
color:#22c55e;
text-decoration:none;
}

</style>
</head>

<body>

<header>
SwapPay Exchange
</header>

<div class="hero">

<div class="exchange-box">

<h2>Обмен криптовалюты на карту</h2>

<label>Отдаете</label>

<select>
<option>USDT ERC20</option>
<option>BTC</option>
<option>ETH</option>
<option>LTC</option>
</select>

<label>Сумма</label>

<input type="number" placeholder="Введите сумму">

<label>Номер карты</label>

<input type="text" placeholder="Введите номер карты">

<button>
Создать заявку
</button>

</div>

<div class="features">

<div class="feature">
⚡ Быстрые выплаты
</div>

<div class="feature">
🔒 Безопасный обмен
</div>

<div class="feature">
💬 Поддержка Telegram
</div>

<div class="feature">
💰 Выгодный курс
</div>

</div>

</div>

<footer>

Telegram:
<br><br>

<a href="#">
@swappay_exchange_bot
</a>

</footer>

</body>
</html>
